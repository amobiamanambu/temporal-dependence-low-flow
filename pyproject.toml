[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowflow-temporal-dependence"
version = "0.1.1"
description = "Verification tools for temporally coherent probabilistic low-flow forecasts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Amobichukwu C. Amanambu", email = "acamanambu@ua.edu"}
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
full = [
  "pyarrow>=12",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "geopandas>=0.14",
  "cartopy>=0.22",
  "netCDF4>=1.6",
  "rasterio>=1.3",
  "pyshp>=2.3",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
